services:
  app:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        - APP_NAME=app
    image: tradingviewtask/app-wasm:latest
    container_name: tradingviewtask-app
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tradingviewtask-network

networks:
  tradingviewtask-network:
    driver: bridge
